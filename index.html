<!doctype html>
<html lang="pl">
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gul gul! — wyścig przez pole</title>
<style>
:root{font-family:Arial,sans-serif;color:#fff9df;background:#dce9d4}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}main,.game{width:100%;height:100%;height:100dvh}.game{position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%}.hud{position:absolute;top:max(24px,env(safe-area-inset-top));left:24px;right:24px;display:flex;justify-content:space-between;pointer-events:none;gap:16px}.stat{background:#294332dc;border:2px solid #ffffff35;border-radius:14px;padding:12px 18px;min-width:150px;box-shadow:0 4px 0 #1f332c30}.label{font-size:10px;font-weight:800;letter-spacing:1.2px}.number{font-size:32px;font-weight:900;margin-top:5px;font-variant-numeric:tabular-nums}.track{height:6px;background:#ffffff26;margin-top:8px;border-radius:6px;overflow:hidden}.fill{height:100%;background:#a7cb72;transition:width .12s;width:74%}.overlay{position:absolute;inset:0;z-index:2;display:flex;align-items:center;justify-content:center;text-align:center;background:#18362d40}.overlay.hidden{display:none}.card{max-width:470px;margin:20px;padding:30px;text-shadow:0 2px 4px #172f2955}.eyebrow{font-size:11px;font-weight:800;letter-spacing:2px;color:#fff0b5;margin-bottom:12px}.card h2{font-family:Impact,'Arial Black',sans-serif;font-size:clamp(48px,8vw,94px);line-height:.95;text-transform:uppercase;letter-spacing:-2px;margin:0;transform:rotate(-3deg);text-shadow:3px 5px 0 #2b4839}.card p{font-size:15px;line-height:1.6;max-width:330px;margin:24px auto;color:#fffbed}button{border:2px solid #fff2;background:#e96537;color:#fffbed;font:800 15px Arial,sans-serif;border-radius:12px;padding:16px 26px;cursor:pointer;touch-action:manipulation;box-shadow:0 5px 0 #9c3e25;user-select:none}button:active{transform:translateY(3px);box-shadow:0 2px 0 #9c3e25}button:focus-visible{outline:3px solid #fff3ab;outline-offset:5px}#start{font-size:18px;min-width:215px}.bottom{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:24px;right:24px;display:flex;align-items:center;gap:16px;pointer-events:none}.bottom>*{pointer-events:auto}.hint{margin-right:auto;font-size:13px;color:#fff9df;text-shadow:0 2px 3px #2b3828}.hint strong{font-weight:700}kbd{display:inline-block;background:#294332d9;border:1px solid #fff5;border-bottom:3px solid #ffffff65;border-radius:7px;padding:10px 14px;font:800 12px Arial,sans-serif;margin-right:10px}#subhint,.hint br{display:none}.sound{background:#294332dc;box-shadow:0 4px 0 #1f332c60;font-size:12px;padding:13px}.movement{min-width:125px}.game:has(.overlay:not(.hidden)) .hint,.game:has(.overlay:not(.hidden)) .movement{visibility:hidden}.game:has(.overlay:not(.hidden)) .sound{position:relative;z-index:3}@media(max-width:600px){.hud{top:16px;left:14px;right:14px}.stat{min-width:120px;padding:10px 12px}.label{font-size:8px}.number{font-size:26px}.bottom{bottom:max(18px,env(safe-area-inset-bottom));left:14px;right:14px;flex-wrap:wrap;justify-content:space-between}.hint{width:100%;font-size:11px}.card{padding:16px}.card p{font-size:14px}.movement{flex:1}}@media(max-height:440px){.hud{top:12px}.stat{padding:7px 12px}.number{font-size:23px}.bottom{bottom:12px}.card{padding:10px}.card h2{font-size:48px}.card p{margin:12px auto;font-size:12px}.eyebrow{display:none}#start{padding:12px 22px}}
.level-badge{position:absolute;top:28px;left:50%;transform:translateX(-50%);padding:10px 16px;border-radius:30px;background:#294332dc;font-size:12px;font-weight:800;white-space:nowrap;pointer-events:none}@media(max-width:600px){.level-badge{top:112px;font-size:11px}}@media(max-height:440px){.level-badge{top:14px}}
.movement{display:flex;gap:10px}.movement button{min-width:60px;padding:14px 18px}.movement button.next{outline:2px solid #ffe59c;outline-offset:3px}#leap{background:#466d51;box-shadow:0 5px 0 #294332}@media(max-width:600px){.movement{flex:1}.movement button{flex:1}.hint kbd{padding:7px;margin-right:5px}}
.countdown{position:absolute;inset:0;z-index:4;display:flex;align-items:center;justify-content:center;pointer-events:none;font:900 clamp(90px,18vw,180px) Impact,sans-serif;color:#fff0b5;text-shadow:5px 7px 0 #294332;transform:rotate(-4deg)}.countdown.hidden{display:none}
</style>
<main><section class="game"><canvas id="scene" aria-label="Widok z boku: chudy biegacz ucieka przed indykiem przez pole"></canvas><div class="hud"><div class="stat"><div class="label">DO PŁOTU</div><div class="number" id="distance">240 m</div></div><div class="stat"><div class="label">INDYK ZA TOBĄ</div><div class="number" id="gap">14,0 m</div><div class="track"><div class="fill" id="danger"></div></div></div></div><div class="level-badge" id="level">1 / 4 · Rozgrzewka</div><div id="countdown" class="countdown hidden" role="status" aria-live="assertive"></div><div class="overlay" id="overlay"><div class="card"><div class="eyebrow" id="caption">INDYK DEPCZE PO PIĘTACH</div><h2 id="title">Gul gul!</h2><p id="message">Biegnij strzałkami ← → na przemian. Spacją przeskakuj błoto — inaczej ugrzęźniesz! Na każdym poziomie więcej kałuż.</p><button id="start">GRAJ · SPACJA</button></div></div><div class="bottom"><div class="hint"><kbd>← →</kbd><kbd>SPACJA ↑</kbd><strong id="rhythm">Strzałki na zmianę. Spacja = skok.</strong><br><span id="subhint">Złap rytm: około 3 kroki na sekundę.</span></div><div class="movement"><button id="left" aria-label="Lewa noga">←</button><button id="right" aria-label="Prawa noga">→</button><button id="leap">SKOK ↑</button></div><button class="sound" id="sound" aria-pressed="false">Dźwięk: wył.</button></div></section>
</main>
<script>
const canvas=document.querySelector('canvas'),c=canvas.getContext('2d');const $=id=>document.getElementById(id);let mode='ready',distance=0,gap=14,speed=0,elapsed=0,lastStep=0,phase=0,now=0,last=0,muted=true,audio,particles=[],jump=0,jumpVelocity=0,lastFoot=null,muddy=false,mudUntil=0,mudPatches=[],countdownElapsed=0,countdownNumber=3,gulRemaining=0;const levels=[{name:'Rozgrzewka',length:240,gap:14,chase:6.25,drag:3.1,pace:3,mudCount:3},{name:'Obrażony indyk',length:280,gap:13,chase:6.55,drag:3.4,pace:3,mudCount:5},{name:'Dziób zemsty',length:320,gap:12,chase:6.75,drag:3.7,pace:4,mudCount:8},{name:'Indyk ostateczny',length:360,gap:11,chase:6.95,drag:4,pace:4,mudCount:12}];let levelIndex=0,finish=levels[0].length;const currentLevel=()=>levels[levelIndex];
function sound(f=220,d=.08,type='sine'){if(muted)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(f,audio.currentTime);o.frequency.exponentialRampToValueAtTime(f*.55,audio.currentTime+d);g.gain.setValueAtTime(.055,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+d)}catch{}}
function start(){if(mode==='won')levelIndex=(levelIndex+1)%levels.length;const level=currentLevel();finish=level.length;mode='countdown';countdownElapsed=0;countdownNumber=3;gulRemaining=0;last=0;$('countdown').textContent='3';$('countdown').classList.remove('hidden');distance=0;gap=level.gap;speed=4;elapsed=0;lastStep=0;phase=0;particles=[];jump=0;jumpVelocity=0;lastFoot=null;muddy=false;mudUntil=0;mudPatches=Array.from({length:level.mudCount},(_,i)=>({start:30+i*(finish-55)/level.mudCount,width:3.2+levelIndex*.25}));highlightFoot();$('overlay').classList.add('hidden');$('rhythm').textContent=`← → na zmianę · Spacja = skok`;$('level').textContent=`${levelIndex+1} / ${levels.length} · ${level.name}`;updateHud();sound(440)}
function highlightFoot(){$('left').classList.toggle('next',lastFoot==='right');$('right').classList.toggle('next',lastFoot==='left')}
function step(foot){if(mode!=='playing'||!['left','right'].includes(foot))return;if(foot===lastFoot){$('rhythm').textContent='Zmień nogę! ← → na przemian.';return}let interval=elapsed-lastStep;if(lastFoot&&interval<.12)return;let good=lastFoot&&interval>=.24&&interval<=.48;speed=Math.min(muddy?4.5:8,speed+(good?1.5:1.1));lastStep=elapsed;lastFoot=foot;highlightFoot();phase+=.8;$('rhythm').textContent=muddy?'Błoto! Skacz spacją!':good?'Świetny rytm! Uważaj na błoto.':'Lewa, prawa · Spacja = skok';sound(good?260:180,.06,'triangle');if(jump===0)particles.push({x:410,y:399,life:.6})}
function leap(){if(mode!=='playing'||jump>0)return;jumpVelocity=300;jump=.1;muddy=false;mudUntil=0;sound(480,.12,'triangle')}
$('start').onclick=()=>{if(mode!=='countdown'&&mode!=='playing')start()};
for(const foot of ['left','right']){$(foot).addEventListener('pointerdown',e=>{e.preventDefault();step(foot)})}
$('leap').addEventListener('pointerdown',e=>{e.preventDefault();leap()});
$('sound').onclick=()=>{muted=!muted;$('sound').textContent='Dźwięk: '+(muted?'wył.':'wł.');$('sound').setAttribute('aria-pressed',String(!muted));sound(550)};
window.addEventListener('keydown',e=>{if(!['ArrowLeft','ArrowRight','Space'].includes(e.code))return;e.preventDefault();if(e.repeat)return;if(e.code==='Space'){if(mode==='playing')leap();else if(mode!=='countdown')start();return}if(mode==='ready')start();step(e.code==='ArrowLeft'?'left':'right')});document.addEventListener('visibilitychange',()=>{last=0});
function end(won){mode=won?'won':'lost';const completed=won&&levelIndex===levels.length-1;const next=levels[levelIndex+1];$('overlay').classList.remove('hidden');$('caption').textContent=completed?'WSZYSTKIE INDYKI POKONANE':`POZIOM ${levelIndex+1} / ${levels.length} · ${currentLevel().name}`;$('title').textContent=completed?'Mistrz ucieczki!':won?'Uff! Za płotem.':'GUL GUL!';$('message').textContent=completed?`Finał w ${elapsed.toFixed(1).replace('.',',')} s. Cztery pola za tobą, spodnie całe!`:won?`Ucieczka w ${elapsed.toFixed(1).replace('.',',')} s! Dalej: ${next.name}, ${next.length} m. Błoto: ${next.mudCount} kałuż. Strzałki na zmianę, spacja nad błotem.`:`Indyk dopadł cię po ${Math.floor(distance)} metrach. Strzałki ← → na zmianę, spacja = skok nad błotem!`;$('start').textContent=completed?'Od początku · SPACJA':won?'Dalej · SPACJA':'Powtórz · SPACJA';sound(won?700:120,.35,'triangle')}
function updateHud(){$('distance').textContent=Math.ceil(finish-distance)+' m';$('gap').textContent=gap.toFixed(1).replace('.',',')+' m';$('danger').style.width=(gap/19*100)+'%';$('danger').style.background=gap<6?'#d64630':'#789553'}

function ellipse(x,y,rx,ry,color){c.fillStyle=color;c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);c.fill()}function line(points,color,width=3){c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.lineJoin='round';c.beginPath();points.forEach((p,i)=>i?c.lineTo(...p):c.moveTo(...p));c.stroke()}function poly(p,col){c.fillStyle=col;c.beginPath();p.forEach((v,i)=>i?c.lineTo(...v):c.moveTo(...v));c.closePath();c.fill()}
function fence(x){for(let j=0;j<5;j++){c.fillStyle='#e8d4a1';c.fillRect(x+j*34,326,9,80);poly([[x+j*34,326],[x+j*34+4,316],[x+j*34+9,326]],'#e8d4a1')}c.fillStyle='#c2a572';c.fillRect(x-5,342,153,8);c.fillRect(x-5,373,153,8)}
function runner(x,y,t){c.save();c.translate(x,y);const stride=Math.sin(t),bob=Math.abs(Math.cos(t))*3;c.translate(0,-bob);ellipse(0,3,29,5,'#53634422');line([[-4,-47],[-14+stride*19,-24],[-20+stride*31,-2]],'#38433a',7);line([[3,-47],[14-stride*17,-26],[17-stride*31,-2]],'#38433a',7);line([[-20+stride*31,-2],[-9+stride*31,-2]],'#e8e3cc',7);line([[17-stride*31,-2],[29-stride*31,-2]],'#e8e3cc',7);poly([[-10,-89],[7,-91],[13,-49],[-8,-46]],'#e96943');line([[3,-82],[19+stride*12,-65],[27+stride*13,-85]],'#d8a379',5);line([[-6,-82],[-22-stride*11,-68],[-31-stride*9,-80]],'#d8a379',5);line([[2,-91],[1,-102]],'#d8a379',7);ellipse(3,-113,12,16,'#e9bb8b');ellipse(14,-112,5,3,'#e9bb8b');poly([[-9,-115],[-8,-129],[0,-133],[12,-128],[14,-120],[3,-125],[-3,-116]],'#3d4335');ellipse(9,-118,1.7,2,'#26372f');line([[8,-105],[12,-105]],'#8c614a',1.5);c.restore()}
function turkey(x,y,t){c.save();c.translate(x,y);ellipse(0,3,36,6,'#53634422');for(let j=0;j<7;j++){c.save();c.translate(-19,-30);c.rotate(-1.1+j*.3);ellipse(0,-22,9,29,j%2?'#895036':'#a9653f');ellipse(0,-43,7,7,'#d9a363');c.restore()}const s=Math.sin(t);line([[-9,-13],[-11+s*12,-2],[-2+s*12,0]],'#b88337',4);line([[10,-13],[12-s*12,-2],[22-s*12,0]],'#b88337',4);ellipse(0,-29,30,23,'#664331');ellipse(3,-32,19,13,'#9d6645');line([[-7,-34],[7,-29],[15,-34]],'#c08a58',2);line([[21,-35],[28,-58],[35,-65]],'#c9513c',12);ellipse(36,-65,11,12,'#689294');poly([[43,-68],[58,-63],[44,-59]],'#e6b64b');ellipse(42,-67,2,2,'#223e35');line([[37,-73],[45,-71]],'#263f35',2);ellipse(44,-54,4,9,'#d9563c');c.restore()}
function drawMud(){for(const patch of mudPatches){const x=440+(patch.start-distance)*15,width=patch.width*15;if(x>1150||x+width<0)continue;ellipse(x+width/2,401,width/2+5,11,'#74513a');ellipse(x+width/2,400,width/2,7,'#493c2d');ellipse(x+width*.35,398,width*.18,2,'#a08556');ellipse(x+width*.76,402,width*.12,2,'#96764b')}if(muddy){c.fillStyle='#ffe9b0';c.font='bold 17px Arial';c.fillText('BŁOTO! − TEMPO',380,238)}}
function draw(){const w=canvas.clientWidth,h=canvas.clientHeight,dpr=Math.min(devicePixelRatio||1,2);if(canvas.width!==Math.round(w*dpr)||canvas.height!==Math.round(h*dpr)){canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr)}const scale=Math.max(w/1100,Math.min(h/550,w/600)),ox=(w-1100*scale)*.4,oy=(h-550*scale)*.65;c.setTransform(dpr,0,0,dpr,0,0);c.fillStyle='#dce9d4';c.fillRect(0,0,w,h);c.fillStyle='#bdab73';c.fillRect(0,oy+398*scale,w,h);c.setTransform(scale*dpr,0,0,scale*dpr,ox*dpr,oy*dpr);c.fillStyle='#dce9d4';c.fillRect(0,0,1100,550);ellipse(874,117,39,39,'#f9edb7');for(let i=0;i<5;i++){let x=((i*280-distance*1.1)%1400+1400)%1400-130;ellipse(x,116+i%2*37,46,9,'#f8f9e9');ellipse(x+22,109+i%2*37,28,13,'#f8f9e9')}poly([[0,274],[0,222],[170,182],[335,232],[530,192],[760,229],[955,175],[1100,215],[1100,290]],'#bdcfa5');poly([[0,310],[0,268],[215,231],[462,266],[665,217],[914,266],[1100,227],[1100,325]],'#a4bc87');let barn=820-distance*.65;c.fillStyle='#b96d4e';c.fillRect(barn,230,81,61);poly([[barn-10,232],[barn+40,194],[barn+92,232]],'#715847');c.fillStyle='#785c43';c.fillRect(barn+32,259,23,32);c.fillStyle='#d5d39b';c.fillRect(0,290,1100,110);for(let i=0;i<35;i++){let x=((i*67-distance*5)%1200+1200)%1200-50;let y=310+(i%4)*20;line([[x,y+13],[x,y],[x-4,y+4],[x,y+7],[x+4,y+1]],'#b6bb79',1.3)}for(let i=0;i<4;i++){let x=((i*360+120-distance*3)%1450+1450)%1450-100;ellipse(x,337,30,25,'#d9bd76');ellipse(x,337,22,19,'#c5a665');ellipse(x,337,14,12,'#d9bd76');ellipse(x,337,6,5,'#c5a665')}c.fillStyle='#bdab73';c.fillRect(0,398,1100,152);c.fillStyle='#d6c48e';c.fillRect(0,405,1100,66);for(let i=0;i<65;i++){let x=((i*71-distance*15)%1200+1200)%1200;c.fillStyle=i%2?'#bca974':'#e1ce96';c.fillRect(x,414+i%7*8,6+i%4*4,2)}c.fillStyle='#8c9d60';c.fillRect(0,395,1100,5);for(let i=0;i<70;i++){let x=((i*39-distance*18)%1200+1200)%1200;line([[x,550],[x+4,514-i%5*4],[x+8,531]],'#a4965c',2)}drawMud();if(distance>finish-45)fence(440+(finish-distance)*15);let moving=mode==='playing';let t=moving?phase:now*2;runner(440,398-jump-(mode==='won'?30:0),t);turkey(440-35-gap*12,398,t*1.5);particles.forEach(p=>{ellipse(p.x,p.y,6*p.life,3*p.life,'#f3e0ae88')});if(moving&&gap<7){c.font='bold 19px sans-serif';c.fillStyle='#a34c30';c.fillText('GUL GUL!',440-70-gap*12,296)}if(mode==='lost'){c.font='bold 28px sans-serif';c.fillStyle='#d34f32';c.fillText('!',464,255)}}
function frame(ms){now=ms/1000;let dt=last?Math.min(.05,now-last):0;last=now;if(document.hidden)dt=0;if(mode==='countdown'){countdownElapsed+=dt;const digit=Math.max(1,3-Math.floor(countdownElapsed));if(countdownElapsed>=3){mode='playing';dt=0;gulRemaining=.65;$('countdown').textContent='GUL!';sound(650,.22,'triangle')}else if(digit!==countdownNumber){countdownNumber=digit;$('countdown').textContent=String(digit);sound(440,.08,'triangle')}}else if(gulRemaining>0){gulRemaining=Math.max(0,gulRemaining-dt);if(gulRemaining===0)$('countdown').classList.add('hidden')}if(mode==='playing'){elapsed+=dt;if(jump>0){jumpVelocity-=600*dt;jump=Math.max(0,jump+jumpVelocity*dt);if(jump===0)jumpVelocity=0}const patch=jump<8?mudPatches.find(p=>!p.triggered&&distance>=p.start&&distance<=p.start+p.width):null;if(patch){patch.triggered=true;mudUntil=elapsed+.65;speed*=.55;sound(90,.16,'sawtooth');$('rhythm').textContent='Błoto! Zaraz odzyskasz tempo.'}const wasMuddy=muddy;muddy=elapsed<mudUntil;if(wasMuddy&&!muddy)$('rhythm').textContent='Biegnij dalej! ← → na zmianę.';speed=Math.max(0,Math.min(muddy?4.5:8,speed)-(currentLevel().drag+(muddy?3:0))*dt);distance+=speed*dt;gap=Math.min(19,gap+(speed-(currentLevel().chase+Math.min(elapsed*.012,.4)))*dt);phase+=speed*dt*2;particles.forEach(p=>{p.x-=speed*dt*15;p.y-=dt*8;p.life-=dt});particles=particles.filter(p=>p.life>0);if(gap<=0){gap=0;end(false)}else if(distance>=finish){distance=finish;end(true)}updateHud()}draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
</script></html>
